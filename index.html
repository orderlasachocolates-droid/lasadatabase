<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LASA CHOCOLATES – Order Management Dashboard</title>
    <meta name="description"
        content="Premium order management dashboard for LASA CHOCOLATES. Manage customer orders, track profit, and analyze product sales.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="loginScreen" class="login-screen">
        <div class="login-bg-pattern"></div>
        <div class="login-container">
            <div class="login-logo">
                <h1 class="login-title">LASA CHOCOLATES</h1>
                <p class="login-subtitle">Order Management Dashboard</p>
            </div>
            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Enter access code" required>
                </div>
                <div id="loginError" class="login-error" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i> Incorrect password. Please try again.
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <p class="login-footer">Secure Admin Panel</p>
        </div>
    </div>

    <!-- ==================== LOADING SCREEN ==================== -->
    <div id="loadingScreen" class="loading-screen" style="display:none;">
        <div class="loading-center">
            <div class="loading-logo-icon"><i class="fas fa-cookie-bite"></i></div>
            <h2 class="loading-brand">LASA CHOCOLATES</h2>
            <p class="loading-tagline">Baking your dashboard...</p>
            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN APP ==================== -->
